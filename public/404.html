<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada · Bruno Costa</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f5f1;
        --text: #17181c;
        --muted: #55565e;
        --accent: #4338ca;
        --accent-contrast: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0f13;
          --text: #ecebe6;
          --muted: #a9a9b3;
          --accent: #a5a6ff;
          --accent-contrast: #12122a;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        line-height: 1.6;
        text-align: center;
      }
      main {
        max-width: 32rem;
      }
      .code {
        font-family: ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace;
        font-size: clamp(3.5rem, 12vw, 6rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        background: linear-gradient(90deg, #dd0031, var(--accent), #149eca);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 {
        margin-top: 1rem;
        font-size: 1.5rem;
      }
      p {
        margin-top: 0.5rem;
        color: var(--muted);
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.7rem 1.4rem;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-contrast);
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      a.plain {
        display: inline;
        margin: 0;
        padding: 0;
        background: none;
        color: var(--accent);
        text-decoration: underline;
      }
      .en {
        margin-top: 2.5rem;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Página não encontrada</h1>
      <p>O endereço pode ter mudado ou não existe mais.</p>
      <a href="/">Voltar ao portfólio</a>
      <p class="en" lang="en">
        Page not found. <a class="plain" href="/">Back to the portfolio</a>
      </p>
    </main>
  </body>
</html>
