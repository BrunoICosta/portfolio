<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bruno Costa — Desenvolvedor Front-end Angular &amp; React</title>
    <meta
      name="description"
      content="Portfólio de Bruno Vinicius Isaac Costa, desenvolvedor front-end especializado em Angular e React, com foco em TypeScript, testes e acessibilidade."
    />
    <script>
      // Apply the saved/OS theme before first paint to avoid a flash of the wrong theme.
      ;(function () {
        try {
          var stored = localStorage.getItem('bc-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
